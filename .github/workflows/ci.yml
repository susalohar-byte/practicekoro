name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # `tsc --noEmit` against the root tsconfig (files: [], references only) checks
      # nothing at all; the project's real typecheck is `tsc -b` inside npm run typecheck.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Runs the suite and enforces the coverage floors in vitest.config.ts (src/, not src/utils).
      - run: npm run test:coverage -- --reporter=verbose

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # npm run build also builds the Student Web Panel into dist/dashboard
      - run: npm ci --prefix student-web
      - run: npm run build

  notify:
    name: Notify on Failure
    needs: [typecheck-and-lint, test, build]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI failed — check the workflow logs above."
