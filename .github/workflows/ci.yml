name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-lint:
    name: Typecheck + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # `tsc --noEmit` against the root tsconfig (files: [], references only) checks
      # nothing at all; the project's real typecheck is `tsc -b` inside npm run typecheck.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Two migrations sharing a version would make `supabase db push` skip one.
      - run: node scripts/check-migrations.mjs

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Runs the suite and enforces the coverage floors in vitest.config.ts (src/, not src/utils).
      - run: npm run test:coverage -- --reporter=verbose

  build:
    name: Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # npm run build also builds the Student Web Panel into dist/dashboard
      - run: npm ci --prefix student-web
      - run: npm run build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Hermetic: demo-mode build plus a stubbed Supabase host (playwright.config.ts),
      # so no spec reaches production or Razorpay.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practicekoro_mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  notify:
    name: Notify on Failure
    needs: [typecheck-and-lint, test, build, e2e, mobile]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI failed — check the workflow logs above."
